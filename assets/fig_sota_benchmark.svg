<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Literature Operating Speed and Infrastructure Positioning</title>
  <desc id="sb-desc">Comparison of published maximum operating speeds for BRT, Tram/LRT, ART, Subway, and Maglev from Feng et al. (2024) and Lee et al. (2006), illustrating the regional-to-trunk gap targeted by MagLink.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .lbl-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f4c81; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .val-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #0f4c81; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="388" rx="12"/>
  <text class="title" x="28" y="34">Literature Benchmark: Maximum Operating Speed vs. Infrastructure Dependency</text>
  <text class="subtitle" x="28" y="54">Published benchmarks from Feng et al. (2024, Table 5) [3] and Lee et al. (2006) [2]; MagLink bridges local road agility and highway trunk speed.</text>

  <!-- Vertical reference gridlines -->
  <line class="grid" x1="210" y1="70" x2="210" y2="352"/>
  <line class="grid" x1="290" y1="70" x2="290" y2="352"/>
  <line class="grid" x1="370" y1="70" x2="370" y2="352"/>
  <line class="grid" x1="450" y1="70" x2="450" y2="352"/>
  <line class="grid" x1="530" y1="70" x2="530" y2="352"/>
  <line class="grid" x1="610" y1="70" x2="610" y2="352"/>

  <text class="lbl" x="198" y="97" text-anchor="end">BRT (Diesel, Road)</text><rect x="210" y="78" width="48" height="28" rx="5" fill="#94a3b8"/><text class="val" x="268" y="97">60 km/h · Existing road [3]</text><text class="lbl" x="198" y="143" text-anchor="end">Tram / LRT (Steel Rail)</text><rect x="210" y="124" width="56" height="28" rx="5" fill="#64748b"/><text class="val" x="276" y="143">70 km/h · New rails & bridges [3]</text><text class="lbl" x="198" y="189" text-anchor="end">ART (Virtual Track)</text><rect x="210" y="170" width="56" height="28" rx="5" fill="#3b82f6"/><text class="val" x="276" y="189">70 km/h · Existing road, virtual track [3]</text><text class="lbl" x="198" y="235" text-anchor="end">Subway (Heavy Metro)</text><rect x="210" y="216" width="64" height="28" rx="5" fill="#475569"/><text class="val" x="284" y="235">80 km/h · Exclusive tunnel/bridge [3]</text><text class="lbl" x="198" y="281" text-anchor="end">Maglev (Dedicated Trunk)</text><rect x="210" y="262" width="344" height="28" rx="5" fill="#0284c7"/><text class="val" x="564" y="281">430+ km/h · Dedicated guideway [2]</text><text class="lbl-accent" x="198" y="333" text-anchor="end">MagLink (Proposed)</text><rect x="210" y="314" width="56" height="28" rx="5" fill="#0f4c81"/><rect x="272" y="314" width="180" height="28" rx="5" fill="#e0ecf7" stroke="#0f4c81" stroke-width="1.8" stroke-dasharray="6 4"/><text class="val-accent" x="462" y="333">Dual-regime: Local (~60-70) + Maglev trunk (KPI to estimate)</text>

  <text class="axis" x="210" y="370" text-anchor="middle">0</text>
  <text class="axis" x="290" y="370" text-anchor="middle">100 km/h</text>
  <text class="axis" x="370" y="370" text-anchor="middle">200 km/h</text>
  <text class="axis" x="450" y="370" text-anchor="middle">300 km/h</text>
  <text class="axis" x="530" y="370" text-anchor="middle">400 km/h</text>
  <text class="axis" x="610" y="370" text-anchor="middle">500 km/h</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Literature Operating Speed and Infrastructure Positioning</title>
  <desc id="sb-desc">Comparison of published maximum operating speeds for BRT, Tram/LRT, ART, Subway, and dedicated Maglev against MagLink's highway-curve-constrained dual-regime envelope.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .lbl-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f4c81; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .val-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #0f4c81; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="978" height="398" rx="14"/>
  <text class="title" x="28" y="34">Literature Benchmark: Operating Speed vs. Dedicated Rail Dependency</text>
  <text class="subtitle" x="28" y="54">Published speeds from Feng et al. (2024, Table 5) [3] and Lee et al. (2006) [2]; highway curve radii cap realistic MagLink trunk speeds well below 430 km/h.</text>

  <line class="grid" x1="215" y1="74" x2="215" y2="360"/>
  <line class="grid" x1="293" y1="74" x2="293" y2="360"/>
  <line class="grid" x1="371" y1="74" x2="371" y2="360"/>
  <line class="grid" x1="449" y1="74" x2="449" y2="360"/>
  <line class="grid" x1="527" y1="74" x2="527" y2="360"/>
  <line class="grid" x1="605" y1="74" x2="605" y2="360"/>

  <text class="lbl" x="201" y="103" text-anchor="end">BRT (Diesel, Road)</text><rect x="215" y="84" width="46" height="28" rx="6" fill="#64748b"/><text class="val" x="271" y="103">60 km/h &#183; Existing road [3]</text><text class="lbl" x="201" y="149" text-anchor="end">Tram / LRT (Steel Rail)</text><rect x="215" y="130" width="54" height="28" rx="6" fill="#475569"/><text class="val" x="279" y="149">70 km/h &#183; New rails &amp; bridges [3]</text><text class="lbl" x="201" y="195" text-anchor="end">ART (Virtual Track)</text><rect x="215" y="176" width="54" height="28" rx="6" fill="#3b82f6"/><text class="val" x="279" y="195">70 km/h &#183; Existing road, virtual track [3]</text><text class="lbl" x="201" y="241" text-anchor="end">Subway (Heavy Metro)</text><rect x="215" y="222" width="62" height="28" rx="6" fill="#334155"/><text class="val" x="287" y="241">80 km/h &#183; Exclusive tunnel/bridge [3]</text><text class="lbl" x="201" y="287" text-anchor="end">Dedicated Maglev</text><rect x="215" y="268" width="335" height="28" rx="6" fill="#0284c7"/><text class="val" x="560" y="287">430+ km/h &#183; Dedicated closed guideway [2]</text><text class="lbl-accent" x="201" y="341" text-anchor="end">MagLink (Proposed)</text><rect x="215" y="322" width="54" height="28" rx="6" fill="#0f4c81"/><rect x="275" y="322" width="80" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 4"/><text class="val-accent" x="365" y="341">Local (~60-70) + Highway-curve-limited Maglev envelope</text>

  <text class="axis" x="215" y="378" text-anchor="middle">0</text>
  <text class="axis" x="293" y="378" text-anchor="middle">100 km/h</text>
  <text class="axis" x="371" y="378" text-anchor="middle">200 km/h</text>
  <text class="axis" x="449" y="378" text-anchor="middle">300 km/h</text>
  <text class="axis" x="527" y="378" text-anchor="middle">400 km/h</text>
  <text class="axis" x="605" y="378" text-anchor="middle">500 km/h</text>
</svg>

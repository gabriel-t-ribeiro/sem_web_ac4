<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 436" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Exploratory Community Survey Proof of Interest and Design Drivers</title>
  <desc id="sp-desc">Summary of 51 exploratory responses showing strong support for transfer-free bimodal travel, price-and-safety prioritization, and remote supervision plus pre-launch testing requirements.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .sec-h { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f4c81; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1e293b; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .note-box { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .note-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #1e3a8a; }
      .caveat-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .caveat-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="978" height="434" rx="14"/>
  <text class="title" x="26" y="32">Exploratory Community Survey: Proof of Interest &amp; Requirements (n = 51)</text>
  <text class="subtitle" x="26" y="52">Fielded Oct 2&#8211;7, 2026 (84.3% private-car users) &#183; Connects public demand directly to cost constraints and WP2&#8211;WP5 safeguards.</text>

  <rect class="panel" x="24" y="70" width="456" height="304" rx="12"/>
  <text class="sec-h" x="40" y="96">A. Proof of Interest vs. Autonomy Comfort</text>
  <text class="lbl" x="222" y="137" text-anchor="end">Transfer-free travel (Q7 &#8805;4/5)</text><rect x="232" y="124" width="136" height="18" rx="5" fill="#e2e8f0"/><rect x="232" y="124" width="128.0" height="18" rx="5" fill="#2563eb"/><text class="val" x="376" y="137">94.1% · 4.67/5</text><text class="lbl" x="222" y="179" text-anchor="end">Network interest (Q14 &#8805;4/5)</text><rect x="232" y="166" width="136" height="18" rx="5" fill="#e2e8f0"/><rect x="232" y="166" width="109.3" height="18" rx="5" fill="#0284c7"/><text class="val" x="376" y="179">80.4% · 4.10/5</text><text class="lbl" x="222" y="221" text-anchor="end">Bimodal willingness (Q6)</text><rect x="232" y="208" width="136" height="18" rx="5" fill="#e2e8f0"/><rect x="232" y="208" width="96.0" height="18" rx="5" fill="#0d9488"/><text class="val" x="376" y="221">70.6% · 0% No</text><text class="lbl" x="222" y="263" text-anchor="end">Driverless willingness (Q4)</text><rect x="232" y="250" width="136" height="18" rx="5" fill="#e2e8f0"/><rect x="232" y="250" width="88.0" height="18" rx="5" fill="#475569"/><text class="val" x="376" y="263">64.7% · 19.6% No</text><text class="lbl" x="222" y="305" text-anchor="end">Autonomous comfort (Q5 &#8805;4/5)</text><rect x="232" y="292" width="136" height="18" rx="5" fill="#e2e8f0"/><rect x="232" y="292" width="64.1" height="18" rx="5" fill="#d97706"/><text class="val" x="376" y="305">47.1% · 3.43/5</text>
  <rect class="note-box" x="38" y="330" width="428" height="32" rx="8"/>
  <text class="note-txt" x="252" y="350" text-anchor="middle">70.6% bimodal adoption vs. 47.1% comfort &#8594; prove safety first</text>

  <rect class="panel" x="496" y="70" width="460" height="304" rx="12"/>
  <text class="sec-h" x="512" y="96">B. Selection Priorities &amp; Trust Safeguards</text>
  <text class="lbl" x="714" y="137" text-anchor="end">Fare price top factor (Q8)</text><rect x="724" y="124" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="124" width="102.2" height="18" rx="5" fill="#0f4c81"/><text class="val" x="856" y="137">82.4% (42/51)</text><text class="lbl" x="714" y="172" text-anchor="end">Price&#8211;time balance (Q13)</text><rect x="724" y="159" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="159" width="102.2" height="18" rx="5" fill="#1d4ed8"/><text class="val" x="856" y="172">82.4% (42/51)</text><text class="lbl" x="714" y="207" text-anchor="end">Remote oversight &#8805;4/5 (Q10)</text><rect x="724" y="194" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="194" width="102.2" height="18" rx="5" fill="#0284c7"/><text class="val" x="856" y="207">82.4% · 4.31/5</text><text class="lbl" x="714" y="242" text-anchor="end">Safety top factor (Q8)</text><rect x="724" y="229" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="229" width="94.9" height="18" rx="5" fill="#0369a1"/><text class="val" x="856" y="242">76.5% (39/51)</text><text class="lbl" x="714" y="277" text-anchor="end">Public tests (Q11 &#8594; WP5)</text><rect x="724" y="264" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="264" width="82.7" height="18" rx="5" fill="#0d9488"/><text class="val" x="856" y="277">66.7% (34/51)</text><text class="lbl" x="714" y="312" text-anchor="end">Redundancy (Q11 &#8594; WP2)</text><rect x="724" y="299" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="299" width="60.8" height="18" rx="5" fill="#0f766e"/><text class="val" x="856" y="312">49.0% (25/51)</text><text class="lbl" x="714" y="347" text-anchor="end">Autonomy fear (Q9 &#8594; WP2/4)</text><rect x="724" y="334" width="124" height="18" rx="5" fill="#e2e8f0"/><rect x="724" y="334" width="55.9" height="18" rx="5" fill="#b45309"/><text class="val" x="856" y="347">45.1% (23/51)</text>

  <rect class="caveat-box" x="24" y="386" width="932" height="32" rx="8"/>
  <text class="caveat-txt" x="38" y="406">Sample caveat (requirements triage): Cohort is 92.2% aged 18&#8211;24 and 7.8% aged 25&#8211;34 (0% 35+); WP1 expands commuter validation across all ages.</text>
</svg>
